  /* ─────────────────────────────────────────────────────────────────────────
     Design system for a DFIR analyst workspace.

     Not a dashboard, not a marketing page — a dense analytical instrument meant
     to be read for hours. Palette is a calm desaturated ink/slate (low eye
     strain), with a deliberate *categorical* colour language: each kind of
     forensic activity (execution / persistence / filesystem / network / logon)
     carries one restrained hue so an analyst reads activity type at a glance.
     A single alert hue is reserved for flagged (suspicious / anti-forensic)
     events — colour spent only where it carries meaning.

     Monospace is used functionally, not decoratively: timestamps, hashes,
     paths, SIDs align column-to-column so anomalies surface by shape.
     ───────────────────────────────────────────────────────────────────────── */
  :root {
    /* base ink/slate surfaces */
    --bg:        #10151b;   /* deepest — app frame */
    --surface:   #161d26;   /* panels */
    --surface-2: #1c2530;   /* raised rows / inputs */
    --line:      #26313d;   /* hairlines */
    --line-soft: #1f2833;
    --ink:       #dfe6ee;   /* primary text */
    --ink-dim:   #8f9daf;   /* secondary text */
    --ink-faint: #5f6d7e;   /* tertiary / meta */

    /* categorical activity hues (restrained, equal weight) */
    --cat-execution:   #6ea8fe;  /* cool blue   */
    --cat-persistence: #c792ea;  /* violet      */
    --cat-filesystem:  #7fd1b9;  /* teal        */
    --cat-network:     #e6b673;  /* amber       */
    --cat-logon:       #9ec37a;  /* sage        */
    --cat-other:       --ink-faint;

    /* single alert accent — only for flagged events */
    --alert:     #ff6b6b;
    --alert-dim: #7a2f2f;
    --flag:      #e8a33d;  /* amber — flagged/validated share of a bar (distinct from the red alert/spike) */

    --focus:     #6ea8fe;

    /* Noto Sans for the interface; Noto Sans Mono only where character
       alignment matters (paths, command lines, hashes, raw records). */
    --mono: "Noto Sans Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

    --row-h: 30px;
  }

  /* ── Light theme (daybreak): warm paper, darkened hues for contrast ─────── */
  html[data-theme="daybreak"] {
    --bg:        #f3efe7;   /* warm cream — app frame */
    --surface:   #faf7f1;   /* warm off-white panels */
    --surface-2: #efe9df;   /* raised rows / toolbar / inputs */
    --line:      #ddd4c6;   /* warm hairline */
    --line-soft: #e8e1d5;
    --ink:       #2a2621;   /* warm near-black */
    --ink-dim:   #6a6257;
    --ink-faint: #998f7f;

    --cat-execution:   #2563c9;
    --cat-persistence: #8a3fc0;
    --cat-filesystem:  #128a6e;
    --cat-network:     #b06a10;
    --cat-logon:       #4f7a2a;
    --cat-other:       #8792a5;

    --alert:     #d13a3a;
    --alert-dim: #f0c9c9;
    --flag:      #b9791b;  /* amber (darker for light theme contrast) */

    --focus:     #2563c9;
  }

  /* ── Slate theme: a mid-tone between Daybreak and Midnight. Cool grey-blue
     ground (about 4× Midnight's luminance) with saturated, clearly separated
     accents so nothing reads washed out. Replaces Moss (and the older plum
     Sunset). Contrast: body text 10.4:1, secondary 6.7:1 on panels. */
  html[data-theme="slate"] {
    --bg:        #2a3038;
    --surface:   #323943;
    --surface-2: #3b434e;
    --line:      #4b5562;
    --line-soft: #414a56;
    --ink:       #eef2f6;
    --ink-dim:   #bcc6d1;
    --ink-faint: #909ba8;

    --cat-execution:   #7cb8ff;  /* blue  */
    --cat-persistence: #f59bb6;  /* rose  */
    --cat-filesystem:  #57d4b0;  /* jade  */
    --cat-network:     #f2a65a;  /* amber */
    --cat-logon:       #b4dc78;  /* lime  */
    --cat-other:       #909ba8;

    --alert:     #ff7b72;   /* coral */
    --alert-dim: #5a2a2a;
    --flag:      #f4c552;   /* gold  */

    --focus:     #4cc2e8;   /* sky — distinct from every category hue */
  }

  @media (prefers-reduced-motion: no-preference) {
    .app { animation: settle .28s ease-out; }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans); font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── App frame: three-pane analyst workspace ─────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 248px 1fr 0;
    grid-template-rows: 44px 1fr 24px;
    grid-template-areas:
      "topbar topbar topbar"
      "rail   main   detail"
      "status status status";
    height: 100vh;
  }
  .app.detail-open { grid-template-columns: 248px 1fr var(--detail-w, 440px); }

  /* ── Top bar ─────────────────────────────────────────────────────────────── */
  .topbar {
    grid-area: topbar;
    display: flex; align-items: center; gap: 16px;
    padding: 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink);
    font-size: 14px;
  }
  .brand .dot { color: var(--cat-execution); }
  .case-name { color: var(--ink-dim); font-size: 12px; }
  .topbtn {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: var(--sans);
  }
  .topbtn:hover { border-color: var(--focus); }
  #newCaseBtn { color: var(--ink); border-color: var(--focus); }
  .searchgroup { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .topbar .search { position: relative; width: 340px; }
  .topbar-end { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
  /* Hover / focus tooltip (instant, unlike the native title delay). */
  .has-tip { position: relative; }
  .has-tip .tip {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 1500; width: 280px;
    background: var(--ink); color: var(--bg); font: 400 11.5px/1.5 var(--sans); text-align: left;
    padding: 8px 10px; border-radius: 7px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
    opacity: 0; transform: translateY(-3px); pointer-events: none; transition: opacity .12s, transform .12s;
    white-space: normal;
  }
  .has-tip .tip b { font-weight: 600; }
  .has-tip:hover .tip, .has-tip:focus-visible .tip { opacity: 1; transform: none; transition-delay: .25s; }
  @media (prefers-reduced-motion: reduce) { .has-tip .tip { transition: none; } }
  .search input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    padding: 6px 10px 6px 30px;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  .search svg { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--ink-faint); }

  /* top-bar dropdown menu (Export) */
  .menuwrap { position: relative; display: inline-flex; }
  .topbtn .chev { font-size: 10px; margin-left: 3px; color: var(--ink-faint); }
  .menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 900; min-width: 270px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px;
    box-shadow: 0 12px 32px rgba(0,0,0,.28);
  }
  .menuwrap.open .menu { display: block; }
  .menuwrap.open #exportMenuBtn { border-color: var(--focus); }
  .menuitem {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
    background: none; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left;
    color: var(--ink); font-family: var(--sans);
  }
  .menuitem:hover, .menuitem:focus-visible { background: var(--surface-2); outline: none; }
  .menuitem .mi-t { font-size: 12.5px; font-weight: 500; }
  .menuitem .mi-s { font-size: 11px; color: var(--ink-faint); }
  .menusep { height: 1px; background: var(--line-soft); margin: 4px 6px; }

  /* IOC sweep dialog */
  #iocText {
    width: 100%; height: 190px; resize: vertical; margin: 2px 0 8px; padding: 9px 10px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 7px;
    font: 12px/1.5 var(--mono);
  }
  #iocText:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  .ioc-preview { font-size: 12px; color: var(--ink-dim); min-height: 18px; margin-bottom: 12px; }
  .ioc-preview b { color: var(--ink); font-weight: 600; }
  .ioc-preview .warn { color: var(--ink-faint); }
  .ioc-table-wrap { max-height: 46vh; overflow: auto; border: 1px solid var(--line-soft); border-radius: 7px; margin-bottom: 14px; }
  .ioc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ioc-table th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 10.5px; font-weight: 600; color: var(--ink-faint); padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .ioc-table td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .ioc-table td.v { font-family: var(--mono); font-size: 11.5px; word-break: break-all; color: var(--ink); }
  .ioc-table td.n { text-align: right; font-weight: 600; }
  .ioc-table tr.hit td.n { color: var(--alert); }
  .ioc-table tr.miss td { color: var(--ink-faint); }
  .ioc-table td.where { color: var(--ink-dim); font-size: 11.5px; }
  .ioc-table td.ts { white-space: nowrap; color: var(--ink-dim); }
  /* Clickable result rows (IOC indicators and Sigma rules): hand cursor on the
     whole row (including over text), hover tint, and a chevron cue. */
  .ioc-table tr.hit[data-val], .ioc-table tr.hit[data-rule] { cursor: pointer; }
  .ioc-table tr.hit[data-val] td, .ioc-table tr.hit[data-rule] td { cursor: pointer; user-select: none; }
  .ioc-table tr.hit[data-val]:hover td, .ioc-table tr.hit[data-rule]:hover td { background: var(--surface-2); }
  .ioc-table td.go { width: 18px; color: var(--ink-faint); text-align: right; padding-left: 0; }
  .ioc-table tr.hit:hover td.go { color: var(--focus); }
  /* Mini timeline strip above the event list */
  .minitl { flex: none; position: relative; border-bottom: 1px solid var(--line); background: var(--surface); padding: 6px 12px 4px; }
  .minitl[hidden] { display: none; }
  .minitl svg { display: block; width: 100%; height: 40px; cursor: crosshair; touch-action: none; }
  .minitl .mt-bar { fill: color-mix(in srgb, var(--focus) 45%, transparent); }
  .minitl .mt-flag { fill: var(--alert); opacity: .85; }
  .minitl .mt-out { fill: var(--bg); opacity: .55; }
  .minitl .mt-sel { fill: color-mix(in srgb, var(--focus) 22%, transparent); stroke: var(--focus); stroke-width: 1; }
  .minitl .mt-hover { fill: color-mix(in srgb, var(--ink) 12%, transparent); }
  .minitl .mt-axis { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
  .minitl .mt-axis .sp { flex: 1; }
  .minitl .mt-tip { position: absolute; top: -2px; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); font-size: 11px; padding: 4px 8px; border-radius: 5px; white-space: nowrap; pointer-events: none; z-index: 20; }
  .minitl .mt-tip[hidden] { display: none; }
  .minitl .mt-btn { font: 500 10.5px var(--sans); color: var(--ink-dim); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; cursor: pointer; }
  .minitl .mt-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .minitl.collapsed svg, .minitl.collapsed .mt-tip { display: none; }
  /* Analysed host (rail) */
  .hostsec .hs-head { padding: 6px 0 2px; cursor: pointer; }
  .hostsec.active .hs-head .name { font-weight: 600; }
  .hs-sum { cursor: pointer; padding: 0 0 2px 2px; line-height: 1.35; }
  .hs-name { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); word-break: break-all; }
  .hs-sub { display: block; font-size: 10.5px; color: var(--ink-faint); }
  .hs-body { padding: 6px 0 2px 2px; }
  .hs-row { display: flex; gap: 8px; font-size: 11px; line-height: 1.6; }
  .hs-k { flex: none; width: 74px; color: var(--ink-faint); }
  .hs-v { color: var(--ink-dim); min-width: 0; word-break: break-all; }
  .hs-v .mono { font-family: var(--mono); font-size: 10.5px; word-break: normal; overflow-wrap: normal; }
  .hs-hint { font-size: 10.5px; color: var(--ink-faint); margin-top: 4px; }
  .hs-link { font-size: 11.5px; color: var(--focus); margin-top: 6px; cursor: pointer; }
  .hs-link:hover { text-decoration: underline; }
  /* Host chip (top bar, unused) and host view */
  .hostchip { display: inline-flex; align-items: center; gap: 6px; max-width: 360px; font: 500 12px var(--sans); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 3px 11px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hostchip[hidden] { display: none; }
  .hostchip:hover, .hostchip.active { border-color: var(--focus); }
  .hostchip .hcx { color: var(--ink-faint); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
  .hostchip svg { flex: none; width: 13px; height: 13px; color: var(--ink-faint); }
  .hostcard { margin: 2px 0 4px; padding: 11px 13px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; }
  .hostcard:hover, .hostsec.active .hostcard { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus) inset; }
  .hc-name { font-size: 15px; font-weight: 600; color: var(--ink); word-break: break-all; }
  .hc-dom { font-weight: 400; color: var(--ink-faint); }
  .hc-line { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; line-height: 1.4; }
  .hc-line.mono { font-family: var(--mono); font-size: 11px; }
  .hc-meta { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  .hc-hint { font-size: 11px; color: var(--ink-faint); margin-top: 6px; line-height: 1.4; }
  .hc-cta { font-size: 11.5px; color: var(--focus); margin-top: 7px; }
  .app[data-view="host"] .grid-head { display: none; }
  .hostview { padding: 18px 22px 30px; max-width: 1200px; }
  .hv-h { font-size: 18px; font-weight: 600; color: var(--ink); margin: 0 0 6px; }
  .hostview h3 { font-size: 12px; font-weight: 600; color: var(--ink-faint); margin: 20px 0 8px; }
  .hv-kv { border-collapse: collapse; font-size: 12.5px; min-width: 520px; }
  .hv-kv th { text-align: left; font-weight: 500; color: var(--ink-faint); padding: 5px 18px 5px 0; vertical-align: top; white-space: nowrap; }
  .hv-kv td { color: var(--ink); padding: 5px 12px 5px 0; }
  .hv-s { text-align: right; width: 70px; }
  .hv-src { font: 500 11px var(--sans); color: var(--focus); background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
  .hv-src:hover { text-decoration: underline; }
  .hostview .mono { font-family: var(--mono); font-size: 11.5px; }
  .hostview .faint { color: var(--ink-faint); }
  .hv-tag { font-size: 10px; font-weight: 600; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .clear-all { font: 500 11.5px var(--sans); color: var(--ink); background: none; border: 1px solid color-mix(in srgb, var(--alert) 55%, var(--line)); border-radius: 12px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  .clear-all:hover { background: color-mix(in srgb, var(--alert) 12%, transparent); }
  .clear-all::before { content: "✕"; font-size: 10px; margin-right: 5px; color: var(--alert); }
  .allev { cursor: pointer; }
  .allev.active .name { color: var(--ink); font-weight: 600; }
  .linkbtn { background: none; border: 0; padding: 0 0 0 8px; color: var(--focus); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .ioc-table tr.sep td { background: var(--surface-2); color: var(--ink-faint); font-size: 11px; cursor: pointer; }

  /* progress overlay for ingest / open */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,11,18,0.72); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }

  /* triage controls in the detail pane */
  .triage-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tri-btn {
    font-size: 11px; padding: 4px 9px; border-radius: 5px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .tri-btn:hover { border-color: var(--ink-faint); }
  .tri-btn.active { color: #fff; font-weight: 600; }
  .tri-btn.tri-validated.active     { background: #2e9e5b; border-color: #2e9e5b; }
  .tri-btn.tri-unconfirmed.active   { background: #c99a2e; border-color: #c99a2e; }
  .tri-btn.tri-false_positive.active{ background: #7a8699; border-color: #7a8699; }
  .tri-btn.tri-dismissed.active     { background: #55607a; border-color: #55607a; }
  .tri-note {
    width: 100%; min-height: 48px; resize: vertical; font-family: var(--sans);
    font-size: 12px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 6px; padding: 6px 8px;
  }
  .tri-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 1px 5px; border-radius: 3px; margin-right: 6px; color: #fff;
  }
  .tri-badge.validated      { background: #2e9e5b; }
  .tri-badge.unconfirmed    { background: #c99a2e; }
  .tri-badge.false_positive { background: #7a8699; }
  .tri-badge.dismissed      { background: #55607a; }
  .tri-sum { display: flex; align-items: center; gap: 8px; padding: 3px 6px; margin: 0 -6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .tri-sum:hover { background: var(--surface-2); }
  .tri-sum .dot { width: 8px; height: 8px; border-radius: 2px; }
  .tri-sum .lbl { flex: 1; color: var(--ink-dim); text-transform: capitalize; }
  .tri-sum .cnt { font-family: var(--sans); font-size: 11px; color: var(--ink-faint); }

  /* time-range controls in the toolbar */
  .time-range { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; }
  .tr-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); }
  .time-range input[type="datetime-local"] {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 5px; padding: 2px 6px; font-family: var(--sans); font-size: 11px;
    color-scheme: dark;
  }
  html[data-theme="daybreak"] .time-range input[type="datetime-local"] { color-scheme: light; }
  /* pivot buttons in the detail pane */
  .pivot-btns { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .pivot-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); width: 100%; margin-bottom: 2px; }
  .pv-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--sans);
  }
  .pv-btn:hover { border-color: var(--focus); color: var(--ink); }
  .export-group { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .export-group .topbtn { padding: 4px 12px; }

  /* help / about modal */
  .modal { position: fixed; inset: 0; background: rgba(8,11,18,0.6); z-index: 1100; display: none; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(760px, 90vw); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--ink-dim); font-size: 16px; cursor: pointer; }
  .modal-body { padding: 18px 22px; overflow-y: auto; font-size: 13px; line-height: 1.6; color: var(--ink-dim); }
  .modal-body h3 { color: var(--ink); font-size: 14px; margin: 16px 0 6px; }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .modal-body ul { margin: 4px 0; padding-left: 20px; }
  .modal-body .muted { color: var(--ink-faint); font-size: 12px; }

  /* ingest log view */
  .ilog { padding: 8px 16px; }
  .ilog table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ilog th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  .ilog td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); }
  .ilog td.r { text-align: right; font-family: var(--sans); }
  .ilog .src { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  .st-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; color: #fff; }
  .st-parsed { background: #2e9e5b; }
  .st-unsupported { background: #c99a2e; }
  .st-failed { background: var(--alert); }
  .ilog .detail { color: var(--ink-faint); font-size: 11px; }
  .ilog-summary { display: flex; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ilog-summary b { font-family: var(--sans); }
  /* grouped ingest log */
  .ilog .ilog-group { cursor: pointer; background: var(--surface); }
  .ilog .ilog-group:hover { background: var(--surface-2); }
  .ilog .ilog-group .gname { font-size: 12.5px; }
  .ilog .ilog-group .caret { display: inline-block; width: 12px; color: var(--ink-faint); }
  .ilog .ilog-group .st-badge { margin: 0 8px 0 2px; }
  .ilog .ilog-group .gcount { color: var(--ink-faint); margin-left: 8px; font-family: var(--sans); font-size: 11px; }
  .ilog .ilog-child .src { padding-left: 26px; }
  .ilog .ilog-child { background: transparent; }

  /* ── Activity graph ─────────────────────────────────────────────────────── */
  .actlink .facet { padding: 6px 0; }
  .actlink .actlink-sub { font-size: 10.5px; color: var(--ink-faint); padding: 0 0 2px 2px; }
  .actlink.active .facet .name { font-weight: 600; }

  /* Height is set in JS (--act-h) from the viewport's measured client height,
     AFTER layout settles (double requestAnimationFrame), so it is exact in
     WebView2 — a %/inset against the flex-item .viewport collapses there, and a
     vh calc overshoots because .actwrap sits below the top bars. */
  .actwrap {
    display: flex; flex-direction: column;
    height: var(--act-h, 60vh); min-height: 320px;
  }
  .act-head { padding: 12px 18px 9px; border-bottom: 1px solid var(--line-soft); flex: 0 0 auto; }
  .act-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .act-sub { font-size: 12px; color: var(--ink-dim); margin-top: 4px; line-height: 1.5; max-width: 760px; }
  .act-legend { display: flex; gap: 16px; align-items: center; margin-top: 9px; font-size: 11px; color: var(--ink-dim); flex-wrap: wrap; }
  .act-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .act-legend .sw-total { background: var(--focus); opacity: .55; }
  .act-legend .sw-flag  { background: var(--flag); }
  .act-legend .sw-anom  { background: transparent; outline: 2px solid var(--alert); }
  .act-legend .act-base { margin-left: auto; font-family: var(--sans); color: var(--ink-faint); }

  /* The chart: a horizontally scrolling row of bars that grow from the bottom.
     flex:1 + min-height:0 makes it take exactly the space the header leaves. */
  .actchart {
    flex: 1 1 auto; display: flex; align-items: flex-end; gap: 4px;
    padding: 22px 18px 26px; overflow-x: auto; overflow-y: hidden; min-height: 0;
  }
  /* Bars are bottom-aligned in the chart (align-items:flex-end on .actchart).
     The column gets an explicit PIXEL height in JS, so nothing here relies on a
     %-of-flex-parent height that WebView2 won't resolve. */
  .actbar {
    flex: 0 0 auto; width: 34px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    cursor: pointer; position: relative;
  }
  .actbar-val {
    font-family: var(--sans); font-size: 10px; color: var(--alert);
    height: 14px; line-height: 14px; white-space: nowrap;
  }
  .actbar-col {
    width: 22px; background: var(--focus); opacity: .45; border-radius: 3px 3px 0 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    transition: opacity .12s, outline-color .12s; min-height: 2px; position: relative;
  }
  .actbar-flag { width: 100%; background: var(--flag); border-radius: 0 0 0 0; min-height: 0; }
  .actbar:hover .actbar-col { opacity: .8; }
  .actbar.anom .actbar-col { opacity: .7; outline: 1.5px solid var(--alert); outline-offset: 0; }
  .actbar.anom:hover .actbar-col { opacity: 1; }
  /* X-axis labels: horizontal, centred under the bar, absolutely positioned so
     they never distort bar layout. Only thinned bars carry one (see JS). */
  .actbar-day {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    font-family: var(--sans); font-size: 9.5px; color: var(--ink-faint);
    white-space: nowrap; pointer-events: none;
  }
  .actbar.anom .actbar-day { color: var(--alert); font-weight: 700; }
  /* subtle tick at the first bar of each month, so month boundaries read */
  .actbar.mstart::after {
    content: ""; position: absolute; bottom: -6px; left: -2px; width: 1px; height: 8px;
    background: var(--line);
  }
  /* year boundary: a full-height divider line through the chart + a year caption
     at the top, so a multi-year case is readable at a glance. */
  .actbar.ystart::before {
    content: ""; position: absolute; top: -18px; bottom: -22px; left: -3px;
    width: 0; border-left: 1px dashed var(--ink-faint); opacity: .55;
  }
  .actbar-year {
    position: absolute; top: -14px; left: -3px;
    font-family: var(--sans); font-size: 10px; font-weight: 700; color: var(--ink-dim);
    white-space: nowrap; pointer-events: none;
  }
  .act-year { font-size: 11px; color: var(--ink-faint); font-weight: 400; font-family: var(--sans); margin-left: 6px; }
  .overlay-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 40px; text-align: center; min-width: 280px;
  }
  .overlay-title { font-size: 15px; color: var(--ink); margin-top: 14px; }
  .overlay-sub { font-size: 12px; color: var(--ink-dim); margin-top: 6px; max-width: 360px; overflow-wrap: anywhere; }
  /* allow-list */
  .fc-sup { margin-top: 6px; font-size: 11px; color: var(--focus); cursor: pointer; }
  .fc-sup:hover { text-decoration: underline; }
  .hit-sup { margin-right: 10px; padding: 1px 8px; font-size: 11px; border-radius: 4px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-dim); cursor: pointer; opacity: 0; transition: opacity .1s; font-family: inherit; }
  .hitrow:hover .hit-sup, .hit-sup:focus-visible { opacity: 1; }
  .hit-sup:hover { color: var(--ink); border-color: var(--ink-faint); }
  .sup-box { width: min(560px, 92vw); }
  .sup-body p { margin: 0 0 12px; }
  .sup-body .sg-lbl { display: block; margin: 12px 0 5px; }
  .sup-body .sg-chk { display: block; margin: 3px 0; color: var(--ink); }
  .sup-input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .sup-hint { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  .sup-sum { color: var(--ink-dim); word-break: break-word; }
  .sup-count { font-size: 12px; color: var(--ink); margin-top: 6px; }
  .sup-body .iocv-actions { margin-top: 16px; gap: 8px; }
  .allowv { padding: 18px 22px; max-width: 980px; }
  .allow-entry { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 10px; }
  .ae-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 12px 14px; align-items: center; }
  .ae-what { font-size: 13px; color: var(--ink); }
  .ae-what code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .ae-meta { grid-column: 1; font-size: 12px; color: var(--ink-dim); }
  .ae-rm { grid-column: 2; grid-row: 1 / span 2; }
  .ae-rows { border-top: 1px solid var(--line); padding: 8px 14px 10px; font-size: 12px; }
  .ae-rows summary { cursor: pointer; color: var(--focus); }
  .ae-row { padding: 4px 0; color: var(--ink-dim); display: flex; gap: 8px; align-items: baseline; }
  .ae-ts { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: none; }
  /* Sigma: disable per rule */
  .sg-table td.sg-dis { width: 1%; white-space: nowrap; }
  .sg-disable { opacity: 0; font-size: 11px; }
  .sg-table tr:hover .sg-disable, .sg-disable:focus-visible { opacity: 1; }
  .sg-disabled { margin: 10px 0 4px; font-size: 12px; color: var(--ink-dim); }
  .sg-disabled summary { cursor: pointer; color: var(--focus); }
  .sg-dis-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .sg-dis-note { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }
  /* hover tip for rail entries (artefact descriptions) */
  .rail-tip {
    position: fixed; z-index: 900; max-width: 340px; padding: 8px 11px; border-radius: 6px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 12px; line-height: 1.45; white-space: pre-line;
    opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  .rail-tip.show { opacity: 1; }
  /* live progress inside the overlay */
  .overlay-box.with-prog { width: min(560px, calc(100vw - 32px)); text-align: left; padding: 24px 28px; }
  .overlay-box.with-prog .spinner { display: none; }
  .overlay-box.with-prog .overlay-title { margin-top: 0; font-size: 16px; }
  .overlay-box.with-prog .overlay-sub { max-width: none; }
  .ovp { margin-top: 16px; }
  .ovp-phase { font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; }
  .ovp-bar { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .ovp-fill { height: 100%; width: 0; background: var(--focus); transition: width .25s linear; }
  .ovp-bar.indet .ovp-fill { width: 30% !important; animation: ovpSlide 1.2s ease-in-out infinite; }
  @keyframes ovpSlide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .ovp-pct { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ovp-pct #ovpTime { color: var(--ink-dim); }
  .ovp-file:empty { display: none; }
  .ovp-file { margin-top: 14px; font-size: 12px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .ovp-file .k { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .ovp-file .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; min-width: 0; }
  .ovp-file .s { flex: none; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .ovp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0 0; }
  .ovp-stats div { background: var(--surface-2); border-radius: 6px; padding: 7px 10px; }
  .ovp-stats dt { font-size: 11px; color: var(--ink-faint); }
  .ovp-stats dd { margin: 2px 0 0; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ovp-stats dd.warn { color: var(--sev-medium, #d9a441); }
  .ovp-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .ovp-note { font-size: 11px; color: var(--ink-faint); }
  .ovp-cancel[disabled] { opacity: .6; cursor: default; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--focus);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Left rail: case shape + facets ──────────────────────────────────────── */
  .rail {
    grid-area: rail;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 4px 0 16px;
  }
  .rail section { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .rail h2 {
    font-size: 11px; font-weight: 600; color: var(--ink-faint);
    margin: 0 0 9px; letter-spacing: .02em;
  }
  .metric { display: flex; align-items: baseline; gap: 8px; }
  .metric .big {
    font-family: var(--sans); font-size: 26px; font-weight: 500; color: var(--ink);
    opacity: .82; letter-spacing: -.015em;
  }
  .metric .lbl { color: var(--ink-dim); font-size: 12px; }

  /* facet lists */
  .facet {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px; margin: 0 -6px;
    border-radius: 5px; cursor: pointer; user-select: none;
  }
  .facet:hover { background: var(--surface-2); }
  .facet.active { background: var(--surface-2); }
  .facet .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .facet .name { flex: 1; color: var(--ink-dim); font-size: 12.5px; }
  .facet.active .name { color: var(--ink); }
  .facet .count { font-family: var(--sans); font-size: 11.5px; color: var(--ink-faint); }

  /* SRUM talkers mini-bars */
  .talker { margin: 7px 0; }
  .talker .row { display: flex; justify-content: space-between; gap: 6px; }
  .talker .app { font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; direction: rtl; text-align: left; }
  .talker .amt { font-family: var(--sans); font-size: 11px; color: var(--cat-network); }
  .talker .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .talker .bar i { display: block; height: 100%; background: var(--cat-network); }

  /* ── Center: the timeline (the hero) ─────────────────────────────────────── */
  .main { grid-area: main; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); position: relative; }

  /* Scroll position indicator — appears while dragging through a long timeline
     so the analyst keeps their bearings (row N of total, and the date there). */
  .scrollpos {
    position: absolute; right: 18px; top: 92px; z-index: 20;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font-size: 11.5px; font-family: var(--sans);
    box-shadow: 0 4px 14px rgba(0,0,0,.28); pointer-events: none;
    opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s;
    white-space: nowrap;
  }
  .scrollpos.show { opacity: 1; transform: translateY(0); }
  .scrollpos .sp-row { color: var(--focus); }
  .scrollpos .sp-date { color: var(--ink-dim); }

  .toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-bottom: 1px solid var(--line);
    /* Raised surface so the filter/search strip reads as its own control band,
       breaking up the large flat timeline area. */
    background: var(--surface-2);
  }
  .chip {
    font-size: 11.5px; color: var(--ink-dim);
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 20px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--ink-faint); }
  .chip.on { color: var(--bg); background: var(--alert); border-color: var(--alert); font-weight: 600; }
  .toolbar .spacer { margin-left: auto; }
  .toolbar .result-count { font-family: var(--sans); font-size: 11.5px; color: var(--ink-faint); display: inline-flex; align-items: center; gap: 6px; }
  /* "events matching this IOC" strip, under the toolbar */
  .idf-bar {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 7px 12px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--alert) 9%, var(--surface));
    font-size: 12px; color: var(--ink-dim);
  }
  .idf-bar[hidden] { display: none; }
  .idf-tag { flex: none; font-size: 10.5px; font-weight: 600; color: var(--alert); border: 1px solid color-mix(in srgb, var(--alert) 55%, transparent); border-radius: 4px; padding: 1px 6px; }
  .idf-val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
  .idf-n { flex: none; white-space: nowrap; }
  .idf-sp { flex: 1; }
  .idf-btn { flex: none; white-space: nowrap; font: 500 11.5px var(--sans); color: var(--ink-dim); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
  .idf-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .toolbar .result-count .rc-range { color: var(--ink-dim); }
  .toolbar .result-count .rc-total { color: var(--ink); }
  .pg-btn {
    font-family: var(--sans); font-size: 11px; color: var(--ink-dim);
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 8px; cursor: pointer; margin-left: 2px;
  }
  .pg-btn:hover:not([disabled]) { background: var(--surface-2); color: var(--ink); }
  .pg-btn[disabled] { opacity: .4; cursor: default; }

  /* header row of the grid */
  .grid-head {
    display: grid;
    grid-template-columns: 168px 88px 108px 150px 1fr;
    gap: 0;
    padding: 0 12px;
    height: 26px; align-items: center;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-size: 10.5px; color: var(--ink-faint); font-weight: 600;
    letter-spacing: .02em;
    flex: none;
  }
  .grid-head span { padding-right: 10px; }

  /* virtualized scroll viewport */
  /* overflow-anchor:none is essential for the virtualised timeline: when
     renderWindow resizes the top spacer as you scroll, the browser's scroll
     anchoring would otherwise "helpfully" shift scrollTop to keep an element in
     view, which compounds into a jump/overshoot (the fast-scroll bug). Disabling
     anchoring makes scrollTop map 1:1 to the spacer maths. */
  .viewport { flex: 1; overflow-y: auto; position: relative; overflow-anchor: none; }
  .viewport * { overflow-anchor: none; }
  .spacer-top, .spacer-bot { width: 100%; }

  .evrow {
    display: grid;
    grid-template-columns: 168px 88px 108px 150px 1fr;
    padding: 0 12px;
    height: var(--row-h); align-items: center;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
    position: relative;
  }
  .evrow:hover { background: var(--surface); }
  .evrow.sel { background: var(--surface-2); }
  .evrow.sel::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--focus);
  }
  /* category left tick */
  .evrow .cat-tick { position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; }

  .evrow .c { padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evrow .ts   { font-family: var(--sans); font-size: 11.5px; color: var(--ink-dim); }
  .evrow .kind { font-size: 10.5px; color: var(--ink-faint); }
  .evrow .art  { font-family: var(--sans); font-size: 11px; }
  .evrow .user { font-family: var(--sans); font-size: 11px; color: var(--ink-dim); }
  .evrow .msg  { color: var(--ink); font-size: 12.5px; }
  .evrow .msg .path { color: var(--ink-dim); }
  .evrow.flagged .msg { color: #ffd7d7; }
  .flag-pill {
    font-size: 9.5px; font-weight: 700; color: var(--bg); background: var(--alert);
    padding: 0 5px; border-radius: 3px; margin-right: 6px; letter-spacing: .03em;
  }

  /* ── Right: detail / provenance / raw ────────────────────────────────────── */
  .detail {
    grid-area: detail; background: var(--surface); border-left: 1px solid var(--line);
    display: none; position: relative; min-width: 0; overflow: hidden;
    flex-direction: column;
  }
  .app.detail-open .detail { display: flex; }
  .detail-resizer { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
  .detail-resizer:hover, body.resizing .detail-resizer { background: color-mix(in srgb, var(--focus) 45%, transparent); }
  body.resizing { cursor: col-resize; user-select: none; }
  .detail-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .dh-top { display: flex; align-items: flex-start; gap: 6px; }
  .dh-title { flex: 1; min-width: 0; }
  .detail-head .action { font-family: var(--mono); font-size: 13px; color: var(--ink); word-break: break-all; }
  .detail-head .when { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
  .dh-icon { flex: none; background: none; border: 1px solid transparent; color: var(--ink-faint); font-size: 13px; width: 26px; height: 24px; border-radius: 5px; cursor: pointer; }
  .dh-icon:hover { color: var(--ink); border-color: var(--line); }
  .dfacts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; font-size: 11.5px; }
  .df { display: inline-flex; gap: 5px; min-width: 0; max-width: 100%; }
  .dk { color: var(--ink-faint); }
  .dv { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv.mono { font-family: var(--mono); font-size: 11px; }
  .dflag { margin-top: 8px; font-size: 11.5px; color: var(--alert); line-height: 1.45; }
  .dactions { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; align-items: center; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .seg-lbl { font-size: 11px; color: var(--ink-faint); margin-right: 2px; }
  .detail .tri-btn, .detail .pv-btn { font-size: 11px; padding: 3px 8px; }
  .dtags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; align-items: center; }
  .add-tag { font: 500 11px var(--sans); color: var(--ink-faint); background: none; border: 1px dashed var(--line); border-radius: 11px; padding: 2px 9px; cursor: pointer; }
  .add-tag:hover { color: var(--ink); border-color: var(--ink-faint); }
  .detail .tri-note { margin-top: 8px; min-height: 44px; }
  /* Full message, never truncated: long paths wrap at any character, and a very
     long message scrolls inside a capped box instead of pushing the raw record
     off the panel. */
  .dmsg {
    flex: none; padding: 9px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; line-height: 1.55; color: var(--ink);
    max-height: calc(1.55em * 6 + 18px); overflow-y: auto; overflow-wrap: anywhere; word-break: break-all; user-select: text;
  }
  .draw { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 14px 12px; }
  .draw-bar { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; flex: none; }
  .draw-h { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); }
  .draw-bar .info { color: var(--ink-faint); font-size: 12px; cursor: help; }
  .draw-bar .sp { flex: 1; }
  .mini { font: 500 10.5px var(--sans); color: var(--ink-dim); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; cursor: pointer; }
  .mini:hover { color: var(--ink); border-color: var(--ink-faint); }
  .mini.on { color: var(--ink); border-color: var(--focus); }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; }
  .kv dt { color: var(--ink-faint); font-size: 11.5px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink); word-break: break-all; }
  pre.raw {
    flex: 1; min-height: 120px; margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    color: var(--ink-dim); white-space: pre; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  }
  pre.raw[data-wrap="1"] { white-space: pre-wrap; word-break: break-word; }
  pre.raw .jk { color: var(--cat-execution); }
  pre.raw .js { color: var(--ink); }
  pre.raw .jn { color: var(--cat-network); }
  pre.raw .jl { color: var(--cat-persistence); }
  /* analyst tags */
  .lbl-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--focus); border: 1px solid color-mix(in srgb, var(--focus) 50%, transparent); background: color-mix(in srgb, var(--focus) 10%, transparent); border-radius: 9px; padding: 0 6px; margin-right: 5px; line-height: 15px; vertical-align: 1px; }
  .lbl-chip.more { color: var(--ink-faint); border-color: var(--line); background: none; }
  .lbl-chip.big { font-size: 11px; line-height: 19px; padding: 0 4px 0 8px; margin: 0; }
  .lbl-chip .x { background: none; border: 0; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; opacity: .7; }
  .lbl-chip .x:hover { opacity: 1; }
  .lbl-dot { background: var(--focus); border-radius: 50% !important; }
  .tri-sum.lbl-sum .lbl { text-transform: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar button, .toolbar .topbtn, .toolbar .chip, .toolbar .result-count { white-space: nowrap; }
  /* When the detail panel is wide, drop the Kind and User columns so the
     event text keeps room instead of being squeezed to nothing. */
  .main { container-type: inline-size; }
  @container (max-width: 820px) {
    .grid-head, .evrow { grid-template-columns: 150px 96px 1fr !important; }
    .grid-head span:nth-child(2), .grid-head span:nth-child(4), .evrow .c.kind, .evrow .c.user { display: none; }
    .time-range .tr-label { display: none; }
    .time-range input[type="datetime-local"] { max-width: 150px; }
  }
  .tri-sum.active { background: var(--surface-2); }
  /* right-click menu */
  .ctx { position: fixed; z-index: 2000; width: 300px; max-height: calc(100vh - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 14px 40px rgba(0,0,0,.35); padding: 8px; font-size: 12px; }
  .ctx-h { font-size: 10.5px; font-weight: 600; color: var(--ink-faint); margin: 2px 4px 6px; }
  .ctx-tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 2px; }
  .ctx-tag { display: inline-flex; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; }
  .ctx-tag:hover { border-color: var(--ink-faint); }
  .ctx-tag.on { border-color: var(--focus); }
  .ctx-tag-b { font: 500 11px var(--sans); color: var(--ink-dim); background: none; border: 0; padding: 2px 9px; cursor: pointer; }
  .ctx-tag:hover .ctx-tag-b { color: var(--ink); }
  .ctx-tag.on .ctx-tag-b { color: var(--focus); }
  .ctx-forget { background: none; border: 0; color: var(--ink-faint); cursor: pointer; font-size: 12px; padding: 0 7px 0 0; margin-left: -5px; }
  .ctx-forget:hover { color: var(--alert); }
  .ctx-empty { font-size: 11.5px; color: var(--ink-faint); padding: 0 4px; }
  .ctx-new { padding: 7px 2px 2px; }
  .ctx-new input { width: 100%; font: 12px var(--sans); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .ctx-new input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
  .ctx-sep { height: 1px; background: var(--line-soft); margin: 8px 0; }
  .ctx-tri { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 2px; }
  .ctx-tri .tri-btn { font-size: 11px; padding: 3px 8px; }
  .ctx-item { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: 12px var(--sans); padding: 6px 6px; border-radius: 5px; cursor: pointer; }
  .ctx-item:hover { background: var(--surface-2); }
  .ctx-v { margin-left: auto; color: var(--ink-faint); font-family: var(--mono); font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 14px; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 2100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  /* IOC hunt view */
  .app[data-view="ioc"] .grid-head { display: none; }
  .topbtn.active { border-color: var(--focus); color: var(--ink); box-shadow: inset 0 0 0 1px var(--focus); }
  .app[data-view="ioc"] #rows { height: 100%; }
  .iocv { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 0; height: 100%; }
  .iocv.drag { outline: 2px dashed var(--focus); outline-offset: -8px; }
  .iocv-left { padding: 18px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .iocv-right { padding: 18px 20px; min-width: 0; overflow: auto; }
  .iocv-h { font-size: 15px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .iocv-sub { font-size: 12px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 10px; }
  .iocv #iocText { flex: 1; min-height: 200px; height: auto; resize: none; }
  .iocv-actions { display: flex; align-items: center; gap: 8px; }
  .iocv-drop { flex: 1; font-size: 11px; color: var(--ink-faint); }
  .iocv-empty { max-width: 420px; margin: 60px auto; text-align: center; color: var(--ink-dim); font-size: 12.5px; line-height: 1.6; }
  .iocv-empty h3 { color: var(--ink); font-size: 14px; margin: 0 0 6px; }
  .iocv-sumrow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .iocv-sum { flex: 1; font-size: 13px; color: var(--ink-dim); }
  .iocv-sum .big { font-size: 22px; font-weight: 600; color: var(--ink); opacity: .85; margin-right: 4px; }
  .iocv-sum .faint { color: var(--ink-faint); }
  .iocv .ioc-table-wrap { max-height: none; }
  .iocv-note { font-size: 11.5px; color: var(--ink-faint); margin: 0; }
  .iocv-tabs { display: flex; gap: 2px; padding: 8px 18px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
  .iocv-tab { font: 500 12.5px var(--sans); color: var(--ink-dim); background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px 8px; cursor: pointer; }
  .iocv-tab:hover { color: var(--ink); }
  .iocv-tab.on { color: var(--ink); border-bottom-color: var(--focus); }
  .app[data-view="ioc"] .iocv { height: calc(100% - 40px); }
  .sg-lbl { display: block; font-size: 11px; font-weight: 600; color: var(--ink-faint); margin: 4px 0 5px; }
  .sg-folder { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sg-path { flex: 1; min-width: 0; font: 11.5px var(--mono); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sg-help { font-size: 11.5px; color: var(--ink-faint); line-height: 1.5; margin: 0 0 12px; }
  .sg-help code { font: 11px var(--mono); }
  .sg-link { color: var(--focus); user-select: all; }
  .sg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sg-row .sg-lbl { margin: 0; min-width: 96px; }
  .sg-row select { font: 12px var(--sans); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .sg-chk { font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .sg-auto { margin: 4px 0 12px; }
  .iocv .ioc-preview .warn { color: var(--ink-faint); }
  .sg-table td.sg-title { color: var(--ink); }
  .sg-by { display: block; font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }
  .sg-skipped { margin: 0 0 10px; font-size: 12px; color: var(--ink-dim); }
  .sg-skipped summary { cursor: pointer; color: var(--ink-faint); }
  .sg-skipped ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }
  .idf-bar.is-tag { background: color-mix(in srgb, var(--focus) 9%, var(--surface)); }
  .idf-bar.is-tag .idf-tag { color: var(--focus); border-color: color-mix(in srgb, var(--focus) 55%, transparent); }
  .prov-note { color: var(--ink-faint); font-size: 11px; margin-top: 8px; line-height: 1.5; }

  /* ── Status bar ──────────────────────────────────────────────────────────── */
  .status {
    grid-area: status; background: var(--surface); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 12px;
    font-family: var(--sans); font-size: 11px; color: var(--ink-faint);
  }
  .status .sep { color: var(--line); }
  .status .live { color: var(--cat-logon); }

  /* empty state */
  .empty { display: grid; place-items: center; height: 100%; text-align: center; color: var(--ink-dim); }
  .empty .box { max-width: 340px; }
  .empty h2 { color: var(--ink); font-weight: 600; margin: 0 0 8px; }
  .empty p { font-size: 12.5px; line-height: 1.6; }
  .empty code { font-family: var(--mono); color: var(--cat-execution); }

  /* findings card — the rail's primary call to action. Left border takes the
     worst severity present so the card reads at a glance. */
  .findings-card {
    margin: 2px 0 4px; padding: 13px 14px 12px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-left: 4px solid var(--fc-sev, var(--focus)); cursor: pointer;
    transition: border-color .12s, box-shadow .12s;
  }
  .findings-card:hover { border-color: var(--focus); border-left-color: var(--fc-sev, var(--focus)); box-shadow: 0 0 0 1px var(--focus) inset; }
  .findings-card .fc-count { font-family: var(--sans); font-size: 26px; font-weight: 600; color: var(--fc-sev, var(--ink)); line-height: 1; }
  .findings-card .fc-lbl { font-size: 12.5px; color: var(--ink-dim); margin-left: 6px; }
  .findings-card .fc-tri { font-size: 11px; color: var(--ink-faint); margin-top: 8px; }
  .findings-card .fc-tri b { color: var(--ink-dim); font-weight: 600; }
  .findings-cta {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    margin-top: 11px; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--focus);
    background: var(--focus); color: var(--bg); font: 600 12.5px var(--sans); cursor: pointer;
  }
  .findings-cta .arrow { font-size: 14px; }
  .findings.active .findings-cta { background: transparent; color: var(--focus); }
  .findings-empty { font-size: 12px; color: var(--ink-faint); padding: 2px 0; }

  /* export dialog */
  .modal-back {
    position: fixed; inset: 0; background: rgba(8,11,18,0.62); z-index: 1100;
    display: none; align-items: center; justify-content: center;
  }
  .modal-back.show { display: flex; }
  .exp-modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    width: 400px; max-width: calc(100vw - 32px); padding: 20px 22px 18px; color: var(--ink);
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .exp-modal h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .exp-modal .exp-sub { font-size: 12px; color: var(--ink-dim); margin: 5px 0 14px; }
  .exp-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px;
    border: 1px solid var(--line-soft); margin-bottom: 6px; cursor: pointer; user-select: none;
  }
  .exp-row:hover { border-color: var(--line); background: var(--surface-2); }
  .exp-row input { accent-color: var(--focus); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .exp-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .exp-row .lbl { flex: 1; font-size: 13px; }
  .exp-row .hint { font-size: 11px; color: var(--ink-faint); }
  .exp-row .cnt { font-family: var(--sans); font-size: 12.5px; color: var(--ink-dim); min-width: 44px; text-align: right; }
  .exp-row.zero { opacity: .55; }
  .exp-quick { display: flex; gap: 12px; margin: 2px 0 14px; font-size: 11.5px; }
  .exp-quick a { color: var(--focus); cursor: pointer; text-decoration: none; }
  .exp-quick a:hover { text-decoration: underline; }
  .exp-foot { display: flex; align-items: center; gap: 8px; }
  .exp-foot .total { flex: 1; font-size: 12px; color: var(--ink-dim); }
  .btn-primary {
    background: var(--focus); color: var(--bg); border: 1px solid var(--focus); border-radius: 6px;
    padding: 6px 14px; font: 600 12.5px var(--sans); cursor: pointer;
  }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  /* findings section — top billing */
  .findings.active { background: var(--surface-2); }
  .findings-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .sev-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .sev-pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
  .sev-critical { background: var(--alert); color: var(--bg); }
  .sev-high { background: #d98c4a; color: var(--bg); }
  .sev-medium { background: #d9c04a; color: var(--bg); }
  .sev-low { background: var(--line); color: var(--ink-dim); }
  .sev-informational { background: var(--line); color: var(--ink-faint); }

  /* hunt center-pane detection rows */
  .hitrow { padding: 12px 16px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); cursor: pointer; }
  .hitrow:hover { background: var(--surface); }
  .hitrow.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--focus); }
  .det-tl { margin-right: 6px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
  .sev-border-critical { border-left-color: var(--alert); }
  .sev-border-high { border-left-color: #d98c4a; }
  .sev-border-medium { border-left-color: #d9c04a; }
  .sev-border-low { border-left-color: var(--line); }
  .hit-main { display: flex; align-items: center; gap: 10px; }
  .sev-tag { font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 3px; text-transform: uppercase; letter-spacing: .03em; }
  .hit-title { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .hit-att { margin-left: auto; display: flex; gap: 4px; }
  .att { font-family: var(--mono); font-size: 10px; color: var(--cat-execution); border: 1px solid var(--line); padding: 1px 5px; border-radius: 3px; }
  .hit-sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; }
  .hit-summary { font-size: 12px; color: var(--ink-dim); }
  .hit-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid var(--surface); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="brand">fx<span class="dot">.</span></span>
    <button class="topbtn" id="newCaseBtn">+ New case</button>
    <button class="topbtn" id="openCaseBtn">Open case</button>
    <div class="menuwrap" id="exportMenuWrap">
      <button class="topbtn" id="exportMenuBtn" aria-haspopup="menu" aria-expanded="false">Export <span class="chev">▾</span></button>
      <div class="menu" id="exportMenu" role="menu">
        <button class="menuitem" role="menuitem" id="exportCsvTop"><span class="mi-t">Findings as CSV</span><span class="mi-s">For Excel or sharing</span></button>
        <button class="menuitem" role="menuitem" id="exportStixTop"><span class="mi-t">Findings as STIX 2.1</span><span class="mi-s">For a TIP or MISP</span></button>
        <div class="menusep"></div>
        <button class="menuitem" role="menuitem" id="exportReportTop"><span class="mi-t">Case report (HTML)</span><span class="mi-s">Findings, ATT&amp;CK matrix and evidence hashes</span></button>
      </div>
    </div>
    <span class="case-name" id="caseName">no case open</span>
    <button class="hostchip" id="hostChip" hidden></button>
    <div class="searchgroup">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Filter path, user, message…  (⌘K)" spellcheck="false" />
      </div>
      <button class="topbtn has-tip" id="iocBtn" aria-describedby="iocTip">IOC hunt
        <span class="tip" id="iocTip" role="tooltip"><b>Search for many values at once.</b> Paste or drop a list of IOCs (hashes, IPs, domains, URLs, file names, paths) and hunt the whole case in one pass. Defanged values work.<br><br><b>Sigma rules tab:</b> run community SigmaHQ rules against the case, on top of fx's built-in rules.</span>
      </button>
    </div>
    <div class="topbar-end">
      <button class="topbtn" id="themeBtn" title="Switch theme">◐ Theme</button>
      <button class="topbtn" id="helpBtn" title="About fx / help" aria-label="Help">?</button>
    </div>
  </div>

  <!-- Help / about modal -->
  <div class="modal" id="helpModal">
    <div class="modal-box">
      <div class="modal-head"><span>About fx</span><button class="modal-close" id="helpClose">✕</button></div>
      <div class="modal-body" id="helpBody"></div>
    </div>
  </div>

  <!-- Ingest / open progress overlay -->
  <div class="modal-back" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <div class="exp-modal">
      <h3 id="expTitle">Export findings</h3>
      <div class="exp-sub" id="expSub">Choose which triage states to include.</div>
      <div id="expRows"></div>
      <div class="exp-quick"><a id="expAll">Select all</a><a id="expNone">Clear</a><a id="expDefault">Validated + unconfirmed</a></div>
      <div class="exp-foot">
        <span class="total" id="expTotal"></span>
        <button class="topbtn" id="expCancel">Cancel</button>
        <button class="btn-primary" id="expGo">Export</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-title" id="overlayTitle">Working…</div>
      <div class="overlay-sub" id="overlaySub"></div>
      <div class="ovp" id="ovProg" hidden>
        <div class="ovp-phase" id="ovpPhase"></div>
        <div class="ovp-bar"><div class="ovp-fill" id="ovpFill"></div></div>
        <div class="ovp-pct"><span id="ovpPct">0%</span><span id="ovpTime"></span></div>
        <div class="ovp-file" id="ovpFile"></div>
        <dl class="ovp-stats" id="ovpStats"></dl>
        <div class="ovp-foot">
          <span class="ovp-note" id="ovpNote"></span>
          <button class="topbtn ovp-cancel" id="ovpCancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="rail" id="rail"></aside>

  <div class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="idf-bar" id="idfBar" hidden></div>
    <div class="minitl" id="miniTl" hidden></div>
    <div class="grid-head">
      <span>Time (UTC)</span><span>Kind</span><span>Artefact</span><span>User</span><span>Event</span>
    </div>
    <div class="viewport" id="viewport">
      <div class="spacer-top" id="spTop"></div>
      <div id="rows"></div>
      <div class="spacer-bot" id="spBot"></div>
    </div>
    <div class="scrollpos" id="scrollPos" aria-hidden="true"></div>
  </div>

  <aside class="detail" id="detail"></aside>

  <div class="status" id="status"></div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>

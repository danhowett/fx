kind: event
id: defense_evasion_indicators
title: Defense evasion (log clearing / AV tampering / recovery inhibition)
description: >
  Actions to blind defenders or prevent recovery — clearing event logs
  (wevtutil / Clear-EventLog / EventID 1102 & 104), disabling AV, deleting
  volume shadow copies and backups, and disabling recovery. Consolidates the
  highest-signal evasion behaviours across command lines and lifted event
  actions.
severity: high
attack:
  - T1070.001
  - T1562.001
  - T1490
detection:
  any:
    - match:
        field: process.command_line
        op: regex
        values:
          - "wevtutil(\\.exe)?\\s+(cl|clear-log)\\b"
          - "clear-eventlog\\b"
          - "\\bvssadmin(\\.exe)?\\s+delete\\s+shadows\\b"
          - "\\bwmic(\\.exe)?\\s+shadowcopy\\s+delete\\b"
          - "\\bwbadmin(\\.exe)?\\s+delete\\s+(catalog|systemstatebackup)\\b"
          - "\\bbcdedit(\\.exe)?.*(recoveryenabled\\s+no|bootstatuspolicy\\s+ignoreallfailures)"
          - "Set-MpPreference\\s+.*-Disable"
          - "Add-MpPreference\\s+-ExclusionPath"
          - "\\bsc(\\.exe)?\\s+(stop|config)\\s+(windefend|sense|sysmon)"
          - "fltmc(\\.exe)?\\s+unload"
    # Lifted EVTX actions. Explicit list rather than `defense_evasion.*`:
    # Defender 5007 "configuration changed" fires on routine Defender
    # platform/signature updates and is only interesting when it adds an
    # exclusion or disables protection (classified separately by the parser).
    - match:
        field: action
        op: regex
        values:
          - "^defense_evasion\\.(security_log_cleared|audit_policy_changed|defender_rtp_disabled|defender_exclusion_added|defender_protection_disabled|create_remote_thread)$"
    # EventID 104 is "log cleared" ONLY from the Eventlog provider, whose event
    # names the cleared channel. Many unrelated providers reuse id 104; those
    # produced "Event log cleared: " with an empty channel — hundreds of false
    # positives. Require a named channel. (The bare `event.id: 104/1102` match
    # that used to be here ignored the provider entirely and is removed.)
    - all:
        - match:
            field: action
            op: equals
            values:
              - defense_evasion.log_cleared
        - match:
            field: message
            op: regex
            values:
              - "^Event log cleared: \\S"

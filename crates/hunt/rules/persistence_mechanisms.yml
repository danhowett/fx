kind: event
id: persistence_mechanisms
title: Persistence establishment (registry / service / WMI / startup)
description: >
  Creation of autostart persistence via registry Run keys, new services,
  WMI event subscriptions, or startup-folder / IFEO / Winlogon hijacks —
  through reg.exe, sc.exe, wmic, schtasks, or the equivalent registry writes.
severity: high
attack:
  - T1547.001
  - T1543.003
  - T1546
  - T1053.005
detection:
  any:
    - match:
        field: process.command_line
        op: regex
        values:
          - "reg(\\.exe)?\\s+add.*\\\\(CurrentVersion\\\\Run|RunOnce)"
          - "reg(\\.exe)?\\s+add.*\\\\Winlogon\\\\(Shell|Userinit)"
          - "reg(\\.exe)?\\s+add.*Image File Execution Options.*Debugger"
          - "sc(\\.exe)?\\s+create\\b.*binpath"
          - "\\bnew-service\\b"
          - "wmic(\\.exe)?.*(__EventFilter|CommandLineEventConsumer|__FilterToConsumerBinding)"
          - "schtasks(\\.exe)?\\s+/create\\b"
          - "\\bregister-scheduledtask\\b"
    # Inventory entries (every run key / service / task on the host) are NOT
    # findings on their own — that fired on thousands of stock Windows and
    # Office entries. Flag one only when what it launches looks like attacker
    # tradecraft: a staging location, a script host / LOLBin, a URL or a UNC
    # path to an IP. Microsoft's own AppData/ProgramData updaters are excluded.
    - all:
        - match:
            field: action
            op: equals
            values:
              - persistence.run_key
              - service.install
              - service.define
              - persistence.scheduled_task
              - persistence.scheduled_task_created
              - persistence.wmi_subscription
        - match:
            field: message
            op: regex
            values:
              - "[\\\\/](temp|tmp)[\\\\/]"
              - "[\\\\/]appdata[\\\\/]"
              - "[\\\\/]users[\\\\/]public[\\\\/]"
              - "[\\\\/](downloads|desktop)[\\\\/]"
              - "[\\\\/]perflogs[\\\\/]"
              - "\\$recycle\\.bin"
              - "[\\\\/]programdata[\\\\/][^\\\\/]+\\.(exe|dll|bat|cmd|ps1|vbs|js|hta)\\b"
              - "powershell(\\.exe)?.*\\s-(e|en|enc|encodedcommand|w|windowstyle|nop|noprofile)\\b"
              - "powershell(\\.exe)?.*-(ep|executionpolicy)\\s+bypass"
              - "\\b(mshta|wscript|cscript|bitsadmin)(\\.exe)?\\b"
              - "\\bregsvr32(\\.exe)?.*(/i:|scrobj)"
              - "\\bcertutil(\\.exe)?.*(urlcache|decode)"
              - "https?://"
              - "\\\\\\\\[0-9]{1,3}\\."
        - not:
            match:
              field: message
              op: regex
              values:
                - "[\\\\/]appdata[\\\\/]local[\\\\/]microsoft[\\\\/](onedrive|teams|windowsapps|edgeupdate)[\\\\/]"
                - "[\\\\/]programdata[\\\\/]microsoft[\\\\/]"

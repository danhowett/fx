kind: event
id: credential_access_lsass
title: LSASS memory access / credential dumping
description: >
  Access to LSASS memory to steal credentials — via comsvcs.exe MiniDump,
  PowerShell Get-Process lsass dumping, procdump, or direct rundll32 minidump.
  A near-universal step in hands-on-keyboard intrusions.
severity: critical
attack:
  - T1003.001
detection:
  any:
    - match:
        field: process.command_line
        op: regex
        values:
          - "comsvcs\\.dll.*MiniDump"
          - "rundll32.*comsvcs.*#?\\+?24"
          - "Get-Process\\s+lsass"
          - "procdump(64)?(\\.exe)?.*lsass"
          - "-ma\\s+lsass"
          - "dumpert"
          - "nanodump"
          - "MiniDumpWriteDump"
    - match:
        field: message
        op: contains
        values:
          - "Get-Process lsass"
          - "comsvcs.dll MiniDump"
          - "MiniDumpWriteDump"

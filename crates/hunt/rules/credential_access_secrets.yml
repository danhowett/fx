kind: event
id: credential_access_secrets
title: Credential theft — SAM/SYSTEM hive dump, NTDS.dit, or DCSync
description: >
  Dumping of local secret stores (reg save of SAM/SYSTEM/SECURITY), extraction
  of the domain database (ntds.dit via ntdsutil or vssadmin), or DCSync-style
  replication. High-signal credential-access techniques.
severity: critical
attack:
  - T1003.002
  - T1003.003
  - T1003.006
detection:
  any:
    - match:
        field: process.command_line
        op: regex
        values:
          - "reg(\\.exe)?\\s+save\\s+.*(sam|system|security)"
          - "reg(\\.exe)?\\s+save\\s+hklm"
          - "ntdsutil"
          - "ntds\\.dit"
          - "create\\s+full.*(vss|shadow)"
          - "secretsdump"
          - "lsadump"
          - "dcsync"
    - match:
        field: message
        op: contains
        values:
          - "reg save"
          - "DCSync"
    # A file actually named ntds.dit outside its normal homes (a copy staged
    # for exfil). Replaces a loose `message contains ntds.dit` that matched the
    # stock AD LDS template (WinSxS ...adamntds.dit) via MFT events.
    - all:
        - match:
            field: target.path
            op: regex
            values:
              - "(^|[\\\\/])ntds\\.dit$"
        - not:
            match:
              field: target.path
              op: regex
              values:
                - "windows[\\\\/](ntds|winsxs|servicing)[\\\\/]"
